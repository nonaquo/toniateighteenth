<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>toni at eighteenth</title>
    <link rel="preload" as="image" href="pleasewait.png">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="shortcut icon" href="favicon.ico">
    <style>
        /* ==========================================================
           RESPONSIVE SCALING SYSTEM
           Every pixel value from your desktop design is now written as
           calc(N * var(--u)). --u is "1 design pixel" and it grows/shrinks
           with the screen width, so the layout looks exactly the same
           at every size.

           --dw / --dh = the desktop window size you designed on.
           ========================================================== */
        :root {
            --dw: 1728;   /* design width  = your desktop window width  */
            --dh: 1000;   /* design height = your desktop window height */
            --u: calc(100vw / var(--dw));   /* 1 design pixel */
            --hu: var(--u);                 /* hero-only unit */
        }

        /* On phones/tablets the hero text/logo get a bigger unit so they stay readable */
        @media (max-width: 900px) {
            :root {
                --hu: calc(100vw / 700);
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            background-color: #faf9f5;
            font-family: serif;
            overflow-x: hidden;
        }

        img {
            max-width: none; /* sizes are controlled below */
        }

        /* First Section (Hero) */
        .hero-section {
            position: relative;
            width: 100%;
            height: 100vh;
            height: 100svh;
            background-image: url('background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Header Logo Styling */
        .hero-header {
            position: absolute;
            top: calc(30 * var(--hu));
            left: 50%;
            transform: translateX(-50%);
            width: calc(150 * var(--hu));
            height: auto;
            z-index: 10;
        }

        /* Container to center and hold the text images over the fountain */
        .fountain-text-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            max-width: calc(600 * var(--hu));
            height: 100%;
            pointer-events: none;
        }

        @keyframes fancyPopIn {
            0% {
                opacity: 0;
                transform: translateX(-50%) scale(0.6);
            }
            70% {
                transform: translateX(-50%) scale(1.05);
            }
            100% {
                opacity: 1;
                transform: translateX(-50%) scale(1);
            }
        }

        .img-you {
            position: absolute;
            top: 46%;
            left: 50%;
            width: calc(80 * var(--hu));
            height: auto;
            opacity: 0;
            animation: fancyPopIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.5s forwards;
        }

        .img-are {
            position: absolute;
            top: 60%;
            left: 50%;
            width: calc(70 * var(--hu));
            height: auto;
            opacity: 0;
            animation: fancyPopIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) 1.0s forwards;
        }

        .img-invited {
            position: absolute;
            top: 70%;
            left: 50%;
            width: calc(500 * var(--hu));
            height: auto;
            opacity: 0;
            animation: fancyPopIn 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) 1.5s forwards;
        }

        /* Transition Divider Graphic (header.png) */
        .section-divider {
            position: absolute;
            top: calc(100% + 5 * var(--hu));
            left: 50%;
            width: calc(600 * var(--hu));
            height: auto;
            z-index: 10;
            opacity: 0;
            transform: translateX(-50%) translateY(30px);
            transition: opacity 1.2s ease, transform 1.2s ease;
        }

        .section-divider.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Second Section */
        .details-section {
            position: relative;
            width: 100%;
            height: calc(var(--dh) * var(--u));
            display: flex;
            justify-content: center;
            align-items: center;
            padding: calc(80 * var(--u)) calc(20 * var(--u));
            overflow: hidden;
        }

        /* bginvi.png background with scroll transition */
        .details-section::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('bginvi.png');
            background-size: 80% auto;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 2; 

            opacity: 0;
            transform: scale(0.94);
            transition: opacity 1.6s cubic-bezier(0.165, 0.84, 0.44, 1),
                        transform 1.6s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .details-section.visible::before {
            opacity: 1;
            transform: scale(1);
        }

        .details-container {
            position: relative;
            width: 100%;
            max-width: calc(900 * var(--u));
            text-align: center;
            z-index: 3; 
        }

        /* ==========================================
           LAP-DISSOLVE SLIDESHOW CONTAINER
           ========================================== */
        .debutant-photo-wrapper {
            position: absolute;
            z-index: 1;

            top: calc(380 * var(--u));     
            right: calc(230 * var(--u));   

            width: calc(650 * var(--u));   
            height: calc(500 * var(--u));  

            overflow: hidden;
            opacity: 0;
            transform: scale(0.9);
            transition: opacity 1.4s ease 0.5s, transform 1.4s ease 0.5s;
        }

        .details-section.visible .debutant-photo-wrapper {
            opacity: 1;
            transform: scale(1);
        }

        /* Individual Slides */
        .debutant-photo-wrapper img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

            object-fit: cover;
            transform: scale(0.9);
            transform-origin: center;

            object-position: 50% 20%; 

            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }

        .debutant-photo-wrapper img.active {
            opacity: 1;
        }

        /* Scroll-Reveal Animation for invi.png */
        .img-invi {
            width: 100%;
            max-width: calc(610 * var(--u));
            height: auto;
            display: block;
            margin: 0 auto;
            position: relative;
            top: calc(130 * var(--u));
            left: calc(-300 * var(--u));

            opacity: 0;
            transform: translateY(calc(50 * var(--u))) scale(0.95);
            transition: opacity 1.4s cubic-bezier(0.165, 0.84, 0.44, 1) 0.3s,
                        transform 1.4s cubic-bezier(0.165, 0.84, 0.44, 1) 0.3s,
                        filter 0.4s ease;
            cursor: pointer;
            filter: drop-shadow(0px 10px 20px rgba(0, 0, 0, 0.15));
        }

        .img-invi.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .img-invi.visible:hover {
            transform: translateY(-6px) scale(1.02);
            filter: drop-shadow(0px 20px 30px rgba(212, 175, 55, 0.35));
        }

        /* ==========================================
           COUNTDOWN SECTION STYLING
           ========================================== */
        .countdown-section {
       position: relative;
            width: 100%;
            height: calc(var(--dh) * var(--u));
            display: flex;
            justify-content: center;
            align-items: center;
            padding: calc(80 * var(--u)) calc(20 * var(--u));
            overflow: hidden;
            background-color: #faf9f5;
            
            /* --- ADD THIS LINE TO PULL THE WHOLE SECTION UP --- */
            margin-top: calc(-300 * var(--u)); /* Adjust this negative number to move it up as much as you want */
        
        }

        /* bordercount.png background wrapper */
        .countdown-section::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('bordercount.png');
            background-size: 80% auto;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 2;

            opacity: 0;
            transform: scale(0.94);
            transition: opacity 1.6s cubic-bezier(0.165, 0.84, 0.44, 1),
                        transform 1.6s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .countdown-section.visible::before {
            opacity: 1;
            transform: scale(1);
        }

        .countdown-container {
            position: relative;
            width: 100%;
            max-width: calc(900 * var(--u));
            height: 100%;
            text-align: center;
            z-index: 3;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* until.png header text */
        .img-until {
            width: 100%;
            max-width: calc(450 * var(--u));
            height: auto;
            display: block;
            margin-bottom: calc(40 * var(--u));
            opacity: 0;
            transform: translateY(calc(30 * var(--u)));
            transition: opacity 1.2s ease 0.3s, transform 1.2s ease 0.3s;
        }

        .countdown-section.visible .img-until {
            opacity: 1;
            transform: translateY(0);
        }

        /* Countdown Timer Grid Wrapper */
        .countdown-timer-box {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: calc(190 * var(--u));
            opacity: 0;
            transform: translateY(calc(40 * var(--u))) scale(0.95);
            transition: opacity 1.4s cubic-bezier(0.165, 0.84, 0.44, 1) 0.5s,
                        transform 1.4s cubic-bezier(0.165, 0.84, 0.44, 1) 0.5s;
        }

        .countdown-section.visible .countdown-timer-box {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* Individual Time Unit Box (Days, Hours, Minutes, Seconds) */
        .time-block {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Number Display (Pairs of digit images) */
        .digits-wrapper {
            display: flex;
            gap: calc(9 * var(--u));
            margin-bottom: calc(15 * var(--u));
        }

        /* Using 1.png, 2.png, etc. */
        .digit-img {
            width: calc(45 * var(--u));
            height: auto;
            display: block;
        }

        /* Label Image (days.png, hours.png, minutes.png, seconds.png) */
        .label-img {
            width: calc(90 * var(--u));
            height: auto;
            display: block;
        }


        /* ==========================================================
           SECTION 4: THE 18TH TRADITIONS
           ----------------------------------------------------------
           HOW TO MOVE THINGS (all numbers are in "design pixels" and
           scale with the screen, same as the rest of your page):

           - Whole section up/down ........ .trad-section  -> margin-top
           - Title size / gap ............. .trad-title
           - Border size .................. .trad-stage    -> width
           - Each bubble position & size .. the .trad-xxx blocks below
                --x  = left/right  (% across the border, 50% = center)
                --y  = up/down     (% down the border,   50% = middle)
                --w  = bubble size (% of the border width)
                --dur   = how slow it floats (bigger = slower)
                --delay = start offset (keep it negative)
                --amp   = how far it drifts (1 = normal, 2 = double)
           ========================================================== */
        html {
            scrollbar-gutter: stable;
        }

        .trad-section {
            position: relative;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: calc(150 * var(--u)) 0 calc(150 * var(--u));
            margin-top: calc(-250 * var(--u));   /* more negative = closer to the countdown */
            background: transparent;
        }

        /* 18thtrad.png (intro title) */
        .trad-title {
            width: calc(600 * var(--u));
            height: auto;
            display: block;
            margin-bottom: calc(60 * var(--u));
            position: relative;
            z-index: 3;
            opacity: 0;
            transform: translateY(calc(30 * var(--u)));
            transition: opacity 1.2s ease 0.2s, transform 1.2s ease 0.2s;
        }

        .trad-section.visible .trad-title {
            opacity: 1;
            transform: translateY(0);
        }

        /* Stage = the border. Its height follows the image automatically,
           and every bubble is positioned in % of this box. */
        .trad-stage {
            position: relative;
            width: calc(1550 * var(--u));
        }

        .trad-border {
            width: 100%;
            height: auto;
            display: block;
            opacity: 0;
            transform: scale(0.96);
            transition: opacity 1.6s cubic-bezier(0.165, 0.84, 0.44, 1) 0.4s,
                        transform 1.6s cubic-bezier(0.165, 0.84, 0.44, 1) 0.4s;
        }

        .trad-section.visible .trad-border {
            opacity: 1;
            transform: scale(1);
        }

        /* ---- Floating clickable bubbles ---- */
        .trad-item {
            position: absolute;
            left: var(--x);
            top: var(--y);
            width: var(--w);
            padding: 0;
            border: 0;
            background: none;
            cursor: pointer;
            z-index: 2;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;

            opacity: 0;
            transform: translate(-50%, -50%) scale(0.4);
            transition: opacity 1s ease calc(0.6s + var(--i) * 0.2s),
                        transform 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) calc(0.6s + var(--i) * 0.2s);
        }

        .trad-section.visible .trad-item {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .trad-item:focus-visible {
            outline: 2px dashed #8a9a6a;
            outline-offset: 8px;
        }

        /* the constant drifting motion */
        .trad-float {
            display: block;
            animation: tradFloat var(--dur, 7s) ease-in-out var(--delay, 0s) infinite;
        }

        /* hold still while hovering (easier to click) or while open */
        .trad-item:hover .trad-float,
        .trad-item.is-open .trad-float {
            animation-play-state: paused;
        }

        .trad-float img {
            width: 100%;
            height: auto;
            display: block;
            filter: drop-shadow(0 calc(10 * var(--u)) calc(14 * var(--u)) rgba(110, 130, 90, 0.18));
            transition: transform 0.6s cubic-bezier(0.165, 0.84, 0.44, 1),
                        filter 0.6s ease;
        }

        .trad-item:hover .trad-float img {
            transform: scale(1.08);
            filter: drop-shadow(0 calc(16 * var(--u)) calc(24 * var(--u)) rgba(232, 150, 170, 0.45));
        }

        @keyframes tradFloat {
            0%   { transform: translate3d(0, 0, 0) rotate(0deg) scale(1); }
            20%  { transform: translate3d(calc(10 * var(--u) * var(--amp, 1)), calc(-18 * var(--u) * var(--amp, 1)), 0) rotate(1.2deg) scale(1.02); }
            45%  { transform: translate3d(calc(-6 * var(--u) * var(--amp, 1)), calc(-30 * var(--u) * var(--amp, 1)), 0) rotate(-1deg) scale(1.03); }
            70%  { transform: translate3d(calc(-14 * var(--u) * var(--amp, 1)), calc(-10 * var(--u) * var(--amp, 1)), 0) rotate(1.5deg) scale(1.01); }
            100% { transform: translate3d(0, 0, 0) rotate(0deg) scale(1); }
        }

        @media (prefers-reduced-motion: reduce) {
            .trad-float { animation: none; }
        }

        /* ---------- ADJUST EACH BUBBLE HERE ---------- */
        .trad-monetary { --x: 24.5%; --y: 36%; --w: 25%; --dur: 7s;   --delay: -1s; --amp: 1;   --i: 0; }
        .trad-gifts    { --x: 51.5%; --y: 37%; --w: 24%; --dur: 8.5s; --delay: -4s; --amp: 1.1; --i: 1; }
        .trad-candles  { --x: 80%;   --y: 40%; --w: 24%; --dur: 7.5s; --delay: -2s; --amp: 1;   --i: 2; }
        .trad-shots    { --x: 35%;   --y: 69%; --w: 26%; --dur: 9s;   --delay: -6s; --amp: 1.2; --i: 3; }
        .trad-dance    { --x: 62%;   --y: 74%; --w: 21%; --dur: 8s;   --delay: -3s; --amp: 1;   --i: 4; }

        /* ---------- Click-to-open overlay ---------- */
        .trad-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10000;
            visibility: hidden;
            pointer-events: none;
        }

        .trad-overlay.open {
            visibility: visible;
            pointer-events: auto;
            cursor: pointer;
        }

        .trad-backdrop {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);   /* black backdrop: change 0.8 (0 = clear, 1 = solid black) */
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            opacity: 0;
            transition: opacity 1s ease;
        }

        .trad-overlay.show .trad-backdrop {
            opacity: 1;
        }

        .trad-fly,
        .trad-detail {
            position: fixed;
            left: 0;
            top: 0;
            width: 0;
            height: auto;
            opacity: 0;
            transform: translate(-50%, -50%);
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
            will-change: left, top, width, opacity, transform;
        }

        .trad-detail {
            filter: drop-shadow(0 calc(20 * var(--u)) calc(40 * var(--u)) rgba(0, 0, 0, 0.12));
        }

        .trad-close {
            position: fixed;
            top: 20px;
            right: 28px;
            font-size: 42px;
            font-weight: 200;
            font-family: serif;
            line-height: 1;
            color: #fff;
            background: none;
            border: none;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease, color 0.3s;
        }

        .trad-overlay.ready .trad-close {
            opacity: 0.8;
            pointer-events: auto;
        }

        .trad-close:hover {
            opacity: 1;
            color: #d4af37;
        }


        /* ==========================================================
           SECTION 5: RSVP + PLUS ONE INQUIRIES
           ----------------------------------------------------------
           HOW TO MOVE THINGS (same idea as the traditions section):

           - Whole section up/down ... .rsvp-section -> margin-top
           - Section height .......... .rsvp-stage   -> height
           - Each piece, in its own .rsvp-xxx block below:
                --x = left/right (% across the page, 50% = center)
                --y = up/down    (% down the section, 50% = middle)
                --w = size       (% of the page width)
           ========================================================== */
        .rsvp-section {
            position: relative;
            width: 100%;
            padding: 0 0 calc(170 * var(--u));
            margin-top: calc(-70 * var(--u));    /* negative = pull section up */
            background: transparent;
        }

        .rsvp-stage {
            position: relative;
            width: 100%;
            height: calc(600 * var(--u));
        }

        .rsvp-item {
            position: absolute;
            left: var(--x);
            top: var(--y);
            width: var(--w);
            display: block;
            opacity: 0;
            transition: opacity 1.4s ease var(--d, 0s),
                        transform 1.4s cubic-bezier(0.165, 0.84, 0.44, 1) var(--d, 0s);
        }

        .rsvp-item img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* left side slides in from the left, right side from the right */
        .rsvp-left  { transform: translate(calc(-50% - 40 * var(--u)), -50%); }
        .rsvp-right { transform: translate(calc(-50% + 40 * var(--u)), -50%); }

        /* the divider vine grows from the middle */
        .rsvp-divider { transform: translate(-50%, -50%) scaleY(0.6); }

        .rsvp-section.visible .rsvp-left,
        .rsvp-section.visible .rsvp-right {
            opacity: 1;
            transform: translate(-50%, -50%);
        }

        .rsvp-section.visible .rsvp-divider {
            opacity: 1;
            transform: translate(-50%, -50%) scaleY(1);
        }

        /* the clickable confirm link */
        .rsvp-confirm {
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .rsvp-confirm img {
            transition: transform 0.5s cubic-bezier(0.165, 0.84, 0.44, 1),
                        filter 0.5s ease;
        }

        .rsvp-confirm:hover img {
            transform: scale(1.04);
            filter: drop-shadow(0 calc(10 * var(--u)) calc(16 * var(--u)) rgba(232, 150, 170, 0.45));
        }

        .rsvp-confirm:focus-visible {
            outline: 2px dashed #8a9a6a;
            outline-offset: 8px;
        }

        /* ---------- ADJUST EACH PIECE HERE ---------- */
        .rsvp-info    { --x: 24.3%; --y: 26.5%; --w: 28.5%; --d: 0.2s; }   /* kindlyrsvp.png   */
        .rsvp-confirm { --x: 24.9%; --y: 61%;   --w: 32%;   --d: 0.5s; }   /* confirmlink.png  */
        .rsvp-divider { --x: 49.6%; --y: 48%;   --w: 3.4%;  --d: 0.3s; }   /* borderrsvp.png   */
        .rsvp-plusone { --x: 72.9%; --y: 35%;   --w: 43.5%; --d: 0.4s; }   /* plusone.png      */
        .rsvp-number  { --x: 72.6%; --y: 67%;   --w: 23.5%; --d: 0.7s; }   /* number.png       */


        /* ==========================================================
           SECTION 6: MAP
           ----------------------------------------------------------
           HOW TO MOVE THINGS:

           - Whole section up/down ... .map-section -> margin-top
           - Border size ............. .map-stage   -> width
           - Small map position/size . the .map-slot block below:
                --x = left edge  (% across the border)
                --y = top edge   (% down the border)
                --w = width      (% of the border width)
                --h = height     (% of the border height)
           - Dim color when open ..... .map-backdrop -> background
           ========================================================== */
        .map-section {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 0 0 calc(200 * var(--u));
            margin-top: calc(-110 * var(--u));   /* negative = pull section up */
            background: transparent;
        }

        /* Stage = mapborder.png. Its height follows the image. */
        .map-stage {
            position: relative;
            width: calc(1493 * var(--u));
        }

        .map-border {
            width: 100%;
            height: auto;
            display: block;
            opacity: 0;
            transform: scale(0.96);
            transition: opacity 1.6s cubic-bezier(0.165, 0.84, 0.44, 1) 0.2s,
                        transform 1.6s cubic-bezier(0.165, 0.84, 0.44, 1) 0.2s;
        }

        .map-section.visible .map-border {
            opacity: 1;
            transform: scale(1);
        }

        /* The empty spot inside the border where the small map sits.
           (opacity only, no transform, so the map can pop out of it) */
        .map-slot {
            position: absolute;
            left: var(--x);
            top: var(--y);
            width: var(--w);
            height: var(--h);
            opacity: 0;
            transition: opacity 1.4s ease 0.9s;
        }

        .map-section.visible .map-slot {
            opacity: 1;
        }

        /* ---------- ADJUST THE SMALL MAP HERE ---------- */
        .map-slot { --x: 24%; --y: 28%; --w: 52%; --h: 40%; }

        .map-box {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            border-radius: calc(10 * var(--u));
            overflow: hidden;
            background: #e9e5da;
            box-shadow: 0 calc(10 * var(--u)) calc(30 * var(--u)) rgba(0, 0, 0, 0.18);
            transition: box-shadow 0.5s ease;
        }

        .map-box:not(.expanded):not(.is-fixed):hover {
            box-shadow: 0 calc(14 * var(--u)) calc(36 * var(--u)) rgba(212, 175, 55, 0.45);
        }

        .map-box.is-fixed {
            position: fixed;
            z-index: 10001;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);

            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }

        /* invisible button on top of the small map: catches the click
           (clicks inside an iframe can't be detected otherwise) */

            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            border: 0;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .map-box.expanded .map-shield,
        .map-box.is-fixed .map-shield {
            display: none;
        }

        /* dim background while the map is open */
        .map-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10000;
            background: rgba(0, 0, 0, 0.8);   /* 0 = clear, 1 = solid black */
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            opacity: 0;
            visibility: hidden;
            cursor: pointer;
            transition: opacity 0.9s ease, visibility 0s linear 0.9s;
        }

        .map-backdrop.show {
            opacity: 1;
            visibility: visible;
            transition: opacity 0.9s ease, visibility 0s;
        }

        .map-close {
            position: fixed;
            top: 14px;
            right: 26px;
            z-index: 10002;
            font-size: 42px;
            font-weight: 200;
            font-family: serif;
            line-height: 1;
            color: #fff;
            background: none;
            border: none;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease, color 0.3s;
        }

        .map-close.ready {
            opacity: 0.85;
            pointer-events: auto;
        }

        .map-close:hover {
            opacity: 1;
            color: #d4af37;
        }


        /* ==========================================================
           SECTION 7: WISHLIST
           ----------------------------------------------------------
           HOW TO MOVE THINGS:

           - Whole section up/down ... .wish-section -> margin-top
           - Each piece, in its own .wish-xxx line below:
                --x = left/right (% across the section, 50% = center)
                --y = up/down    (% down the section,   50% = middle)
                --w = size       (% of the section width)
                --dur / --delay / --amp = float speed / offset / drift
                                          (gift ideas only)
           ========================================================== */
        .wish-section {
            position: relative;
            width: 100%;
            margin-top: calc(-115 * var(--u));   /* negative = pull section up */
            overflow: hidden;
        }

        /* backgroundwishlist.png: sets the section height automatically */
        .wish-bg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* ---- every piece sits on top of the background ---- */
        .wish-item {
            position: absolute;
            left: var(--x);
            top: var(--y);
            width: var(--w);
            z-index: 2;
            display: block;
            padding: 0;
            border: 0;
            background: none;
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.4);
        }

        .wish-item img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* "Gift" then "Ideas" pop in on the fountain */
        .wish-section.visible .wish-gift {
            animation: wishPopIn 1.1s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.5s forwards;
        }

        .wish-section.visible .wish-ideas {
            animation: wishPopIn 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) 1.1s forwards;
        }

        @keyframes wishPopIn {
            0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
            70%  { transform: translate(-50%, -50%) scale(1.05); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

        /* ---- the gift ideas: floating bubbles ---- */
        .wish-idea {
            cursor: default;
            transition: opacity 1s ease calc(1.8s + var(--i) * 0.18s),
                        transform 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) calc(1.8s + var(--i) * 0.18s);
        }

        .wish-section.visible .wish-idea {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .wish-float {
            display: block;
            animation: tradFloat var(--dur, 6s) ease-in-out var(--delay, 0s) infinite;
        }

        @media (prefers-reduced-motion: reduce) {
            .wish-float { animation: none; }
        }

        /* ---- the clickable "or view the full list" ---- */
        .wish-link {
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: opacity 1s ease 2.8s,
                        transform 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) 2.8s;
        }

        .wish-section.visible .wish-link {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .wish-link img {
            transition: transform 0.5s cubic-bezier(0.165, 0.84, 0.44, 1),
                        filter 0.5s ease;
        }

        .wish-link:hover img {
            transform: scale(1.06);
            filter: drop-shadow(0 calc(8 * var(--u)) calc(14 * var(--u)) rgba(232, 150, 170, 0.55));
        }

        .wish-link:focus-visible {
            outline: 2px dashed #8a9a6a;
            outline-offset: 8px;
        }

        /* ---------- ADJUST EACH PIECE HERE ---------- */
        /* fountain words */
        .wish-gift     { --x: 50.4%; --y: 46.7%; --w: 6%;    }   /* gift.png     */
        .wish-ideas    { --x: 49.9%; --y: 62.1%; --w: 8.5%;  }   /* ideas.png    */

        /* gift ideas (floating) - drift is small so they stay inside the white part */
        .wish-clothes   { --x: 35.1%; --y: 72.6%; --w: 8.5%;  --dur: 6.5s; --delay: -1s; --amp: 0.35; --i: 0; }  /* clothes.png   */
        .wish-legos     { --x: 44.1%; --y: 69.9%; --w: 3%;    --dur: 7.5s; --delay: -3s; --amp: 0.35; --i: 1; }  /* legos.png     */
        .wish-squishies { --x: 56.6%; --y: 70.1%; --w: 4%;    --dur: 7s;   --delay: -5s; --amp: 0.35; --i: 2; }  /* squishies.png */
        .wish-makeup    { --x: 36.6%; --y: 77.2%; --w: 10.5%; --dur: 8s;   --delay: -2s; --amp: 0.35; --i: 3; }  /* makeup.png    */
        .wish-kitchen   { --x: 48%;   --y: 75.6%; --w: 9%;    --dur: 7s;   --delay: -4s; --amp: 0.35; --i: 4; }  /* kitchen.png   */
        .wish-polaroid  { --x: 37.2%; --y: 81.9%; --w: 5.5%;  --dur: 6.8s; --delay: -6s; --amp: 0.35; --i: 5; }  /* polaroid.png  */
        .wish-camera    { --x: 48.9%; --y: 81.9%; --w: 12%;   --dur: 7.8s; --delay: -2.5s; --amp: 0.35; --i: 6; } /* camera.png    */

        /* the clickable link */
        .wish-link      { --x: 62.4%; --y: 75.6%; --w: 13.5%; }   /* listlink.png */


        /* ==========================================================
           DRESS CODE SECTION (between RSVP and Map)
           - Move the whole section ... .dress-section -> margin-top
           - Space before the map .... .dress-section -> padding-bottom
           - Size of the image ....... .dress-img      -> width
           ========================================================== */
        .dress-section {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 0 0 calc(420 * var(--u));
            margin-top: calc(-90 * var(--u));    /* negative = pull section up */
            background: transparent;
        }

        .dress-img {
            width: calc(1555 * var(--u));
            height: auto;
            display: block;
            opacity: 0;
            transform: translateY(calc(40 * var(--u)));
            transition: opacity 1.4s ease 0.2s,
                        transform 1.4s cubic-bezier(0.165, 0.84, 0.44, 1) 0.2s;
        }

        .dress-section.visible .dress-img {
            opacity: 1;
            transform: translateY(0);
        }

        /* ==========================================================
           CREDITS (very bottom of the page)
           - Size of the image ....... .credits-img -> width
           - Space above / below ..... .credits-section -> padding
           ========================================================== */
        .credits-section {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            padding: calc(70 * var(--u)) 0 calc(90 * var(--u));
            background-color: #faf9f5;
        }

        .credits-img {
            width: calc(500 * var(--u));
            height: auto;
            display: block;
            opacity: 0;
            transform: translateY(calc(20 * var(--u)));
            transition: opacity 1.4s ease 0.2s, transform 1.4s ease 0.2s;
        }

        .credits-section.visible .credits-img {
            opacity: 1;
            transform: translateY(0);
        }


        /* ==========================================================
           LOADING SCREEN (pleasewait.png)
           - Size of the image ........ .page-loader-img -> width
           - Background color ......... .page-loader     -> background
           - Fade-out speed ........... .page-loader     -> transition (1s)
           ========================================================== */
        body.loading {
            overflow: hidden;
        }

        .page-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100000;
            background: #faf9f5;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 1;
            visibility: visible;
            transition: opacity 1s ease, visibility 0s linear 1s;
        }

        .page-loader.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .page-loader-img {
            width: clamp(180px, 28vw, 460px);
            height: auto;
            display: block;
            animation: loaderBreath 2.2s ease-in-out infinite;
        }

        @keyframes loaderBreath {
            0%, 100% { opacity: 0.55; transform: scale(0.98); }
            50%      { opacity: 1;    transform: scale(1); }
        }

        /* hold the hero intro animation until the loader is done,
           so guests actually see "you are invited" pop in */
        .loading .img-you,
        .loading .img-are,
        .loading .img-invited {
            animation-play-state: paused;
        }

        /* Slow Lightbox Modal Transition */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            pointer-events: none;
            transition: background-color 0.8s cubic-bezier(0.165, 0.84, 0.44, 1), backdrop-filter 0.8s ease;
            backdrop-filter: blur(0px);
        }

        .modal-overlay.active {
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(6px);
            pointer-events: auto;
        }

        .modal-content {
            position: relative;
            max-width: 85%;
            max-height: 85vh;
            opacity: 0;
            transform: scale(0.85) translateY(20px);
            transition: opacity 0.8s cubic-bezier(0.165, 0.84, 0.44, 1),
                        transform 0.8s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .modal-overlay.active .modal-content {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        .modal-content img {
            width: 100%;
            height: auto;
            max-height: 85vh;
            object-fit: contain;
            display: block;
            border-radius: 0px;
            box-shadow: none;
            background: transparent;
        }

        .modal-close {
            position: absolute;
            top: -45px;
            right: 0;
            color: #fff;
            font-size: 38px;
            font-weight: 200;
            cursor: pointer;
            background: none;
            border: none;
            font-family: serif;
            opacity: 0.8;
            transition: opacity 0.3s, color 0.3s;
        }

        .modal-close:hover {
            opacity: 1;
            color: #d4af37;
        }
    </style>
</head>

    <!-- JavaScript for Scroll-Reveal, Slideshow, & Countdown Timer -->
    <script>
        const observerOptions = {
            root: null,
            threshold: 0.15
        };

        const observer = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, observerOptions);

        observer.observe(document.getElementById('dividerGraphic'));
        observer.observe(document.getElementById('detailsSection'));
        observer.observe(document.getElementById('inviCard'));
        observer.observe(document.getElementById('countdownSection'));
        observer.observe(document.getElementById('tradSection'));
        observer.observe(document.getElementById('rsvpSection'));
        observer.observe(document.getElementById('mapSection'));
        observer.observe(document.getElementById('wishSection'));
        observer.observe(document.getElementById('dressSection'));
        observer.observe(document.getElementById('creditsSection'));

        // Lightbox Modal Logic
        function openModal() {
            const modal = document.getElementById('inviModal');
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            const modal = document.getElementById('inviModal');
            modal.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        // Lap-Dissolve Slideshow Automation
        let currentSlide = 0;
        const slides = document.querySelectorAll('.debutant-photo-wrapper img');
        
        function nextSlide() {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }

        setInterval(nextSlide, 3500);

        // ==========================================
        // COUNTDOWN TIMER LOGIC
        // ==========================================
        // Set your target event date and time here (e.g., October 25, 2026 16:00:00 based on invitation text)
        const targetDate = new Date("October 25, 2026 16:00:00").getTime();

        function updateDigits(containerId, value) {
            const container = document.getElementById(containerId);
            const strVal = String(value).padStart(2, '0'); // Ensures 2 digits like "05"
            const images = container.querySelectorAll('.digit-img');
            
            images[0].src = strVal.charAt(0) + '.png';
            images[1].src = strVal.charAt(1) + '.png';
        }

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance < 0) {
                updateDigits('daysDigits', 0);
                updateDigits('hoursDigits', 0);
                updateDigits('minutesDigits', 0);
                updateDigits('secondsDigits', 0);
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60 * 64)) / (1000 * 60)); // Standard minute calculation
            // Real time calculation for minutes and seconds:
            const realMinutes = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // Corrected time variables mapping
            const finalHours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const finalMinutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const finalSeconds = Math.floor((distance % (1000 * 60)) / 1000);

            updateDigits('daysDigits', days);
            updateDigits('hoursDigits', finalHours);
            updateDigits('minutesDigits', finalMinutes);
            updateDigits('secondsDigits', finalSeconds);
        }

        // Run immediately and update every second
        updateCountdown();
        setInterval(updateCountdown, 1000);

        // ==========================================
        // 18TH TRADITIONS: click a bubble -> it zooms to the
        // screen while its details image fades in
        // ==========================================
        (function () {
            // ---- SETTINGS you can tweak ----
            const OPEN_MS = 1700;                              // zoom-in speed (bigger = slower)
            const CLOSE_MS = 1200;                             // zoom-out speed
            const SCREEN_FILL = 0.92;                          // how much of the screen the details fill (0-1)
            const OPEN_EASE = 'cubic-bezier(0.7, 0, 0.2, 1)';  // starts slow, rushes, then settles
            const CLOSE_EASE = 'cubic-bezier(0.6, 0, 0.25, 1)';

            const overlay = document.getElementById('tradOverlay');
            const fly = document.getElementById('tradFly');
            const detail = document.getElementById('tradDetail');
            const closeBtn = document.getElementById('tradClose');
            const items = document.querySelectorAll('.trad-item');

            let current = null;
            let busy = false;

            // preload details so they open instantly
            items.forEach(it => { const im = new Image(); im.src = it.dataset.detail; });

            function place(el, cx, cy, w) {
                el.style.left = cx + 'px';
                el.style.top = cy + 'px';
                el.style.width = w + 'px';
            }

            function computeFinal() {
                const vw = document.documentElement.clientWidth;
                const vh = window.innerHeight;
                const nw = detail.naturalWidth, nh = detail.naturalHeight;
                const s = Math.min((vw * SCREEN_FILL) / nw, (vh * SCREEN_FILL) / nh);
                const wF = nw * s, hF = nh * s;
                const iw = fly.naturalWidth || 1, ih = fly.naturalHeight || 1;
                const s2 = Math.min(wF / iw, hF / ih);
                return { cx: vw / 2, cy: vh / 2, wF: wF, wFly: iw * s2 };
            }

            function iconBox(item) {
                const r = item.querySelector('img').getBoundingClientRect();
                return { cx: r.left + r.width / 2, cy: r.top + r.height / 2, w: r.width };
            }

            const T = (deg) => 'translate(-50%, -50%) rotate(' + deg + 'deg)';

            async function openTrad(item) {
                if (busy || current) return;
                busy = true;

                const icon = item.querySelector('img');
                fly.src = icon.currentSrc || icon.src;
                detail.src = item.dataset.detail;
                try { await Promise.all([detail.decode(), fly.decode()]); } catch (e) {}
                if (!detail.naturalWidth) {
                    console.warn('Could not load', item.dataset.detail);
                    busy = false;
                    return;
                }

                item.classList.add('is-open');          // freeze the float so the start/end spots match
                const a = iconBox(item);
                const f = computeFinal();

                document.body.style.overflow = 'hidden';
                place(fly, a.cx, a.cy, a.w);
                fly.style.opacity = 1;
                fly.style.transform = T(0);
                place(detail, a.cx, a.cy, a.w);
                detail.style.opacity = 0;
                detail.style.transform = T(0);
                item.style.visibility = 'hidden';       // the clone takes over

                overlay.classList.add('open');
                requestAnimationFrame(() => overlay.classList.add('show'));

                const opts = { duration: OPEN_MS, easing: OPEN_EASE, fill: 'forwards' };

                // the bubble "runs" at the screen with a little tilt, then fades away
                const a1 = fly.animate([
                    { left: a.cx + 'px', top: a.cy + 'px', width: a.w + 'px', opacity: 1, transform: T(0), offset: 0 },
                    { opacity: 1, transform: T(-6), offset: 0.35 },
                    { opacity: 1, offset: 0.5 },
                    { left: f.cx + 'px', top: f.cy + 'px', width: f.wFly + 'px', opacity: 0, transform: T(0), offset: 1 }
                ], opts);

                // the details fade in slowly while it grows
                const a2 = detail.animate([
                    { left: a.cx + 'px', top: a.cy + 'px', width: a.w + 'px', opacity: 0, transform: T(0), offset: 0 },
                    { opacity: 0, transform: T(-3), offset: 0.35 },
                    { opacity: 1, offset: 0.9 },
                    { left: f.cx + 'px', top: f.cy + 'px', width: f.wF + 'px', opacity: 1, transform: T(0), offset: 1 }
                ], opts);

                try { await Promise.all([a1.finished, a2.finished]); } catch (e) {}

                place(detail, f.cx, f.cy, f.wF);
                detail.style.opacity = 1;
                detail.style.transform = T(0);
                fly.style.opacity = 0;
                a1.cancel();
                a2.cancel();

                overlay.classList.add('ready');
                current = item;
                busy = false;
            }

            async function closeTrad() {
                if (busy || !current) return;
                busy = true;
                const item = current;

                overlay.classList.remove('ready');
                overlay.classList.remove('show');

                const a = iconBox(item);
                const f = computeFinal();
                const opts = { duration: CLOSE_MS, easing: CLOSE_EASE, fill: 'forwards' };

                place(fly, f.cx, f.cy, f.wFly);
                fly.style.opacity = 0;

                const a1 = fly.animate([
                    { left: f.cx + 'px', top: f.cy + 'px', width: f.wFly + 'px', opacity: 0, transform: T(0), offset: 0 },
                    { opacity: 0, offset: 0.3 },
                    { opacity: 1, transform: T(5), offset: 0.65 },
                    { left: a.cx + 'px', top: a.cy + 'px', width: a.w + 'px', opacity: 1, transform: T(0), offset: 1 }
                ], opts);

                const a2 = detail.animate([
                    { left: f.cx + 'px', top: f.cy + 'px', width: f.wF + 'px', opacity: 1, transform: T(0), offset: 0 },
                    { opacity: 1, offset: 0.25 },
                    { opacity: 0, offset: 0.7 },
                    { left: a.cx + 'px', top: a.cy + 'px', width: a.w + 'px', opacity: 0, transform: T(0), offset: 1 }
                ], opts);

                try { await Promise.all([a1.finished, a2.finished]); } catch (e) {}

                item.style.visibility = '';
                item.classList.remove('is-open');
                overlay.classList.remove('open');
                a1.cancel();
                a2.cancel();
                fly.style.opacity = 0;
                detail.style.opacity = 0;
                document.body.style.overflow = '';
                current = null;
                busy = false;
            }

            items.forEach(it => it.addEventListener('click', () => openTrad(it)));
            overlay.addEventListener('click', closeTrad);
            closeBtn.addEventListener('click', (e) => { e.stopPropagation(); closeTrad(); });
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeTrad(); });

            // keep the opened details fitted if the window is resized
            window.addEventListener('resize', () => {
                if (current && !busy) {
                    const f = computeFinal();
                    place(detail, f.cx, f.cy, f.wF);
                }
            });
        })();

        // ==========================================
        // MAP: click the small map -> it grows to a big view,
        // background dims. Click outside / x / Esc to shrink back.
        // ==========================================
        (function () {
            // ---- SETTINGS you can tweak ----
            const OPEN_MS = 900;     // grow speed (bigger = slower)
            const CLOSE_MS = 750;    // shrink speed
            const FILL_W = 0.92;     // big map width  (0-1 of the screen)
            const FILL_H = 0.84;     // big map height (0-1 of the screen)
            const EASE = 'cubic-bezier(0.65, 0, 0.2, 1)';

            const slot = document.getElementById('mapSlot');
            const box = document.getElementById('mapBox');
            const shield = document.getElementById('mapShield');
            const backdrop = document.getElementById('mapBackdrop');
            const closeBtn = document.getElementById('mapClose');

            let expanded = false;
            let busy = false;

            function targetRect() {
                const vw = document.documentElement.clientWidth;
                const vh = window.innerHeight;
                const w = vw * FILL_W, h = vh * FILL_H;
                return { left: (vw - w) / 2, top: (vh - h) / 2 + 10, width: w, height: h };
            }

            function setRect(r) {
                box.style.left = r.left + 'px';
                box.style.top = r.top + 'px';
                box.style.width = r.width + 'px';
                box.style.height = r.height + 'px';
            }

            function frame(r, radius) {
                return {
                    left: r.left + 'px', top: r.top + 'px',
                    width: r.width + 'px', height: r.height + 'px',
                    borderRadius: radius
                };
            }

            async function openMap() {
                if (busy || expanded) return;
                busy = true;

                const from = slot.getBoundingClientRect();
                const to = targetRect();
                const startRadius = getComputedStyle(box).borderRadius;

                setRect(from);
                box.classList.add('is-fixed');          // pops out of the border, same spot
                document.body.style.overflow = 'hidden';
                backdrop.classList.add('show');

                const anim = box.animate(
                    [frame(from, startRadius), frame(to, '14px')],
                    { duration: OPEN_MS, easing: EASE, fill: 'forwards' }
                );
                try { await anim.finished; } catch (e) {}

                setRect(to);
                box.style.borderRadius = '14px';
                anim.cancel();

                box.classList.add('expanded');           // map is now usable
                closeBtn.classList.add('ready');
                expanded = true;
                busy = false;
            }

            async function closeMap() {
                if (busy || !expanded) return;
                busy = true;

                closeBtn.classList.remove('ready');
                backdrop.classList.remove('show');
                box.classList.remove('expanded');

                const cur = box.getBoundingClientRect();
                const to = slot.getBoundingClientRect();

                const anim = box.animate(
                    [frame(cur, '14px'), frame(to, '10px')],
                    { duration: CLOSE_MS, easing: EASE, fill: 'forwards' }
                );
                try { await anim.finished; } catch (e) {}

                box.classList.remove('is-fixed');
                box.style.left = box.style.top = box.style.width = box.style.height = '';
                box.style.borderRadius = '';
                anim.cancel();

                document.body.style.overflow = '';
                expanded = false;
                busy = false;
            }

            shield.addEventListener('click', openMap);
            backdrop.addEventListener('click', closeMap);
            closeBtn.addEventListener('click', closeMap);
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMap(); });

            // keep the big map fitted if the window is resized
            window.addEventListener('resize', () => {
                if (expanded && !busy) setRect(targetRect());
            });
        })();
    </script>

    <!-- LOADER SCRIPT: waits for every image, then fades the loading screen -->
    <script>
        (function () {
            // ---- SETTINGS you can tweak ----
            const MIN_MS = 1200;     // show the loader at least this long (avoids a flash)
            const MAX_MS = 20000;    // never keep guests waiting longer than this

            const loader = document.getElementById('pageLoader');
            const startTime = Date.now();

            // images that are not in the HTML right away (backgrounds, countdown digits, details)
            const extraImages = [
                'background.png', 'bginvi.png', 'bordercount.png',
                '0.png', '1.png', '2.png', '3.png', '4.png',
                '5.png', '6.png', '7.png', '8.png', '9.png',
                'monetarye.png', 'giftse.png', 'candlese.png', 'shotse.png', 'dancese.png'
            ];

            if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

            function preload(src) {
                return new Promise(function (resolve) {
                    const im = new Image();
                    im.onload = im.onerror = function () { resolve(); };
                    im.src = src;
                });
            }

            const pageLoaded = new Promise(function (resolve) {
                if (document.readyState === 'complete') resolve();
                else window.addEventListener('load', resolve, { once: true });
            });

            let finished = false;
            function finish() {
                if (finished) return;
                finished = true;
                const wait = Math.max(0, MIN_MS - (Date.now() - startTime));
                setTimeout(function () {
                    window.scrollTo(0, 0);
                    document.body.classList.remove('loading');   // unlock scroll + start hero animation
                    loader.classList.add('hide');                // fade out
                    setTimeout(function () { loader.remove(); }, 1400);
                }, wait);
            }

            Promise.all([pageLoaded].concat(extraImages.map(preload))).then(finish);
            setTimeout(finish, MAX_MS);
        })();
    </script>
