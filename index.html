<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toni at Eighteenth</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #faf9f5;
            font-family: serif;
            overflow-x: hidden;
        }

        /* First Section (Hero) */
        .hero-section {
            position: relative;
            width: 100%;
            height: 100vh;
            background-image: url('background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Header Logo Styling */
        .hero-header {
            position: absolute;
            top: 30px;      
            left: 50%;
            transform: translateX(-50%);
            width: 150px;   
            height: auto;
            z-index: 10;
        }

        /* Container to center and hold the text images over the fountain */
        .fountain-text-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            max-width: 600px;
            height: 100%;
            pointer-events: none;
        }

        @keyframes fancyPopIn {
            0% {
                opacity: 0;
                transform: translateX(-50%) scale(0.6);
            }
            70% {
                transform: translateX(-50%) scale(1.05); 
            }
            100% {
                opacity: 1;
                transform: translateX(-50%) scale(1);
            }
        }

        .img-you {
            position: absolute;
            top: 46%;       
            left: 50%;      
            width: 80px;    
            height: auto;
            opacity: 0; 
            animation: fancyPopIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.5s forwards; 
        }

        .img-are {
            position: absolute;
            top: 60%;       
            left: 50%;      
            width: 70px;    
            height: auto;
            opacity: 0; 
            animation: fancyPopIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) 1.0s forwards; 
        }

        .img-invited {
            position: absolute;
            top: 70%;       
            left: 50%;      
            width: 500px;   
            height: auto;
            opacity: 0; 
            animation: fancyPopIn 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) 1.5s forwards; 
        }

        /* Transition Divider Graphic (header.png) */
        .section-divider {
            position: absolute;
            top: 905px;
            left: 50%;
            transform: translateX(-50%);
            width: 600px; 
            height: auto;
            z-index: 10;
            opacity: 0;
            transform: translateX(-50%) translateY(30px);
            transition: opacity 1.2s ease, transform 1.2s ease;
        }

        .section-divider.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Second Section */
        .details-section {
            position: relative;
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 80px 20px;
            overflow: hidden;
        }

        /* bginvi.png background with scroll transition */
        .details-section::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('bginvi.png');
            background-size: 80% auto;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 2; /* Sits above photos, below invi card */
            
            opacity: 0;
            transform: scale(0.94);
            transition: opacity 1.6s cubic-bezier(0.165, 0.84, 0.44, 1), 
                        transform 1.6s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .details-section.visible::before {
            opacity: 1;
            transform: scale(1);
        }

        .details-container {
            position: relative;
            width: 100%;
            max-width: 900px; 
            text-align: center;
            z-index: 3; /* Top layer for the main invitation card */
        }

        /* ==========================================
           LAP-DISSOLVE SLIDESHOW CONTAINER
           ========================================== */
        .debutant-photo-wrapper {
      position: absolute;
            z-index: 1; 
            
            top: 380px;       /* Adjust to move the frame UP or DOWN */
            right: 230px;     /* Adjust to move the frame LEFT or RIGHT */
            
            width: 650px;     /* <-- ADJUST FRAME WIDTH HERE */
            height: 500px;    /* <-- ADJUST FRAME HEIGHT HERE */
            
            overflow: hidden; 
            opacity: 0;
            transform: scale(0.9);
            transition: opacity 1.4s ease 0.5s, transform 1.4s ease 0.5s;
        }

        .details-section.visible .debutant-photo-wrapper {
            opacity: 1;
            transform: scale(1);
        }

        /* Individual Slides stacked on top of each other for cross-fading */
        .debutant-photo-wrapper img {
         position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            
            object-fit: cover;        
            transform: scale(0.9);    /* <-- Change this: 0.8 makes the photo 80% size, 1.2 makes it 120% */
            transform-origin: center;

            object-position: 50% 20%;
            
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }

        /* Active slide becomes fully visible */
        .debutant-photo-wrapper img.active {
            opacity: 1;
        }

        /* Magical Scroll-Reveal Animation for invi.png */
        .img-invi {
            width: 100%;       
            max-width: 610px;  
            height: auto;
            display: block;
            margin: 0 auto;
            position: relative; 
            top: 130px;           
            left: -300px;          
            
            opacity: 0;
            transform: translateY(50px) scale(0.95);
            transition: opacity 1.4s cubic-bezier(0.165, 0.84, 0.44, 1) 0.3s, 
                        transform 1.4s cubic-bezier(0.165, 0.84, 0.44, 1) 0.3s,
                        filter 0.4s ease;
            cursor: pointer;
            filter: drop-shadow(0px 10px 20px rgba(0, 0, 0, 0.15));
        }

        .img-invi.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .img-invi.visible:hover {
            transform: translateY(-6px) scale(1.02);
            filter: drop-shadow(0px 20px 30px rgba(212, 175, 55, 0.35));
        }

        /* Unique Slow Lightbox Modal Transition */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0); 
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            pointer-events: none; 
            transition: background-color 0.8s cubic-bezier(0.165, 0.84, 0.44, 1), backdrop-filter 0.8s ease;
            backdrop-filter: blur(0px);
        }

        .modal-overlay.active {
            background-color: rgba(0, 0, 0, 0.85); 
            backdrop-filter: blur(6px);
            pointer-events: auto; 
        }

        .modal-content {
            position: relative;
            max-width: 85%;
            max-height: 85vh;
            opacity: 0;
            transform: scale(0.85) translateY(20px); 
            transition: opacity 0.8s cubic-bezier(0.165, 0.84, 0.44, 1), 
                        transform 0.8s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .modal-overlay.active .modal-content {
            opacity: 1;
            transform: scale(1) translateY(0); 
        }

        .modal-content img {
            width: 100%;
            height: auto;
            max-height: 85vh;
            display: block;
            border-radius: 0px; 
            box-shadow: none;   
            background: transparent;
        }

        .modal-close {
            position: absolute;
            top: -45px;
            right: 0;
            color: #fff;
            font-size: 38px;
            font-weight: 200;
            cursor: pointer;
            background: none;
            border: none;
            font-family: serif;
            opacity: 0.8;
            transition: opacity 0.3s, color 0.3s;
        }

        .modal-close:hover {
            opacity: 1;
            color: #d4af37;
        }
    </style>
</head>
<body>

    <!-- SECTION 1: Hero / Landing -->
    <section class="hero-section">
        <img src="tonilogo.png" alt="Toni at Eighteenth Logo" class="hero-header">

        <div class="fountain-text-container">
            <img src="you.png" alt="you" class="img-you">
            <img src="are.png" alt="are" class="img-are">
            <img src="invited.png" alt="invited" class="img-invited">
        </div>

        <img src="header.png" alt="Divider Floral" class="section-divider" id="dividerGraphic">
    </section>

    <!-- SECTION 2: Invitation Details -->
    <section class="details-section" id="detailsSection">
        
        <!-- Debutante Photo Slideshow (Multiple Photos with Lap-Dissolve) -->
        <div class="debutant-photo-wrapper">
            <img src="photo1.jpg" alt="Debutant Photo 1" class="active">
            <img src="photo2.jpg" alt="Debutant Photo 2">
            <img src="photo3.jpg" alt="Debutant Photo 3">
            <img src="photo4.jpg" alt="Debutant Photo 4">
            <img src="photo5.jpg" alt="Debutant Photo 5">
            <!-- Add more photos here easily: <img src="photo3.png" alt="Debutant Photo 3"> -->
        </div>

        <div class="details-container">
            <img src="invi.png" alt="Invitation Details" class="img-invi" id="inviCard" onclick="openModal()">
        </div>
    </section>

    <!-- Fullscreen Lightbox Modal -->
    <div id="inviModal" class="modal-overlay" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <img src="invi.png" alt="Full Invitation View">
        </div>
    </div>

    <!-- JavaScript for Scroll-Reveal & Lap-Dissolve Slideshow -->
    <script>
        const observerOptions = {
            root: null,
            threshold: 0.15
        };

        const observer = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, observerOptions);

        observer.observe(document.getElementById('dividerGraphic'));
        observer.observe(document.getElementById('detailsSection'));
        observer.observe(document.getElementById('inviCard'));

        // Lightbox Modal Logic
        function openModal() {
            const modal = document.getElementById('inviModal');
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            const modal = document.getElementById('inviModal');
            modal.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        // Lap-Dissolve Slideshow Automation
        let currentSlide = 0;
        const slides = document.querySelectorAll('.debutant-photo-wrapper img');
        
        function nextSlide() {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }

        // Changes photo every 3.5 seconds with a smooth cross-fade
        setInterval(nextSlide, 3500);
    </script>

</body>
</html>
